spring:
  application:
    name: url-shortener
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/urlshortener}
    username: ${DB_USERNAME:urlshortener}
    password: ${DB_PASSWORD:urlshortener}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  code:
    length: 7
    max-generation-attempts: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080
